[project]
name = "triage-backend"
version = "0.1.0"
description = "Evidence-first GitHub issue and PR triage backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyJWT[crypto]>=2.8",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
